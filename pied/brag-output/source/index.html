<script>
// Virtual time: the video is rendered frame by frame, so the page's clock,
// timers, animation frames and randomness are all driven from outside.
(function () {
  var now = 0, RD = Date, base = new RD("2026-09-26T09:41:00").getTime();
  function FD() { var a = Array.prototype.slice.call(arguments); if (!a.length) return new RD(base + now); return new (Function.prototype.bind.apply(RD, [null].concat(a)))(); }

  window.Date = FD;
  performance.now = function () { return now; };
  var raf = [], rid = 1, timers = [], tid = 1;
  window.requestAnimationFrame = function (cb) { raf.push({ id: rid, cb: cb }); return rid++; };
  window.cancelAnimationFrame = function (id) { raf = raf.filter(function (r) { return r.id !== id; }); };
  window.setTimeout = function (fn, ms) { var a = Array.prototype.slice.call(arguments, 2); timers.push({ id: tid, at: now + Math.max(0, ms || 0), fn: fn, args: a }); return tid++; };
  window.setInterval = function (fn, ms) { var a = Array.prototype.slice.call(arguments, 2); var id = tid++; timers.push({ id: id, at: now + Math.max(1, ms || 1), every: Math.max(1, ms || 1), fn: fn, args: a }); return id; };
  window.clearTimeout = window.clearInterval = function (id) { timers = timers.filter(function (t) { return t.id !== id; }); };
  var s = 20260926;
  Math.random = function () { s |= 0; s = (s + 0x6D2B79F5) | 0; var t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  window.__step = function (ms) {
    now += ms;
    for (var guard = 0; guard < 1000; guard++) {
      var due = null;
      for (var i = 0; i < timers.length; i++) if (timers[i].at <= now && (!due || timers[i].at < due.at)) due = timers[i];
      if (!due) break;
      if (due.every) due.at += due.every; else timers = timers.filter(function (t) { return t !== due; });
      due.fn.apply(null, due.args);
    }
    var q = raf; raf = [];
    q.forEach(function (r) { r.cb(now); });
  };
})();
</script>
